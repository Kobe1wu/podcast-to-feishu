name: 播客更新检查

on:
  schedule:
    # UTC 每 2 小时一次（= 北京时间偶数小时），把最坏等待从 12h 压到 2h
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（diagnose = 只做飞书权限自检，不处理播客）'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - diagnose

concurrency:
  group: podcast-check
  cancel-in-progress: false

jobs:
  check-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 已预装 ffmpeg；仅当缺失时才装，省掉每次约 20-40s 的 apt 开销
      - name: 确保 ffmpeg 可用
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行播客检查脚本
        if: ${{ github.event.inputs.mode != 'diagnose' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python src/main.py

      - name: 飞书权限自检（不处理播客）
        if: ${{ github.event.inputs.mode == 'diagnose' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
        run: python src/diagnose.py

      - name: 提交处理状态
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state"
          git push
